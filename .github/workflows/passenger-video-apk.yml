name: Passenger Screen APK

on:
  push:
    branches: ["**"]
    paths:
      - "passenger-video/**"
      - ".github/workflows/passenger-video-apk.yml"
  pull_request:
    paths:
      - "passenger-video/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: passenger-video

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package set includes the obsolete "tools"
          # package, which sdkmanager no longer publishes. The runner image
          # already ships the SDK, and AGP fetches the platform and
          # build-tools it needs, so install nothing extra here.
          packages: ""

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('passenger-video/**/*.gradle*', 'passenger-video/gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: passenger-screen-apk
          path: |
            passenger-video/app/build/outputs/apk/debug/*.apk
            passenger-video/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
