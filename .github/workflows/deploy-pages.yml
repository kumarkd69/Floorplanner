name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/floor-plan-creator-s028fo, main]
  # Lets you redeploy by hand from the Actions tab without pushing a commit.
  workflow_dispatch:

# The deploy job needs to mint an OIDC token for the Pages deployment and to
# write the Pages artifact; everything else stays read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-progress runs are allowed to finish so a
# half-uploaded artifact is never published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check and build
        run: npm run build

      - name: Configure Pages
        # `enablement` turns Pages on the first time this runs, so the site does
        # not need to be switched on by hand beforehand.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
